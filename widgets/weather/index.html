<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/widgets/theme.css">
<script src="/widgets/boot.js"></script>
<style>
  #wicon { position: absolute; top: 2px; right: 0; width: 200px; height: 200px; }
  #wicon svg { display: block; }
  #cond, #place, #hilo { margin-right: 205px; }   /* keep clear of the 200px icon */
  .fc-ic { display: inline-block; vertical-align: -10px; margin-right: 20px; }
  /* slot-fit: one line per label, never wrap — fit() scales to the slot */
  #cond, #place, #hilo, #fc > div {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="tlcd-title">WEATHER</div>
  <div id="card" style="position: relative">
    <span id="wicon"></span>
    <div class="tlcd-big"><span id="temp">&mdash;</span><span id="unit"
         class="tlcd-dim-text" style="font-size:18px"></span></div>
    <div id="cond" class="tlcd-dim-text" style="font-size:54px">&mdash;</div>
    <div id="place" class="tlcd-dim-text" style="font-size:42px"></div>
    <div id="hilo" class="tlcd-dim-text" style="font-size:42px"></div>
    <div id="fc" class="tlcd-dim-text" style="font-size:48px; line-height:1.6"></div>
  </div>
<script>
  // T20: the server fetches Open-Meteo (its own thread, 15-min TTL) and
  // publishes entries into the metrics snapshot keyed by the TRIMMED
  // location option — the key must match byte-for-byte. The view and units
  // options only change rendering: one payload serves every view.
  var OPTS = window.TLCD_OPTIONS || {};
  var loc = String(OPTS.location || "").trim();
  var view = OPTS.view || "today";
  var isF = (OPTS.units || "c") === "f";

  // WMO weather codes (text + icon, never color alone — D35). Unknown codes
  // render as "—"/no icon, never a guess.
  var WMO = {0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy",
             3: "Overcast", 45: "Fog", 48: "Fog",
             51: "Drizzle", 53: "Drizzle", 55: "Drizzle",
             56: "Freezing drizzle", 57: "Freezing drizzle",
             61: "Rain", 63: "Rain", 65: "Rain",
             66: "Freezing rain", 67: "Freezing rain",
             71: "Snow", 73: "Snow", 75: "Snow", 77: "Snow",
             80: "Rain showers", 81: "Rain showers", 82: "Rain showers",
             85: "Snow showers", 86: "Snow showers",
             95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm"};
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // Line icons, currentColor only (inherits the theme text token — D32:
  // no hardcoded color). The cloud is one shared path; each condition adds
  // what sits under or beside it.
  var CLOUD_D = 'M17.5 19H9a7 7 0 1 1 6.71-9h1.45a4.42 4.42 0 1 1 0 8.84Z';
  var CLOUD = '<path d="' + CLOUD_D + '"/>';
  var CLOUD_UP = '<g transform="translate(0,-3) scale(0.88)">' + CLOUD + '</g>';
  var ICONS = {
    sun: '<circle cx="12" cy="12" r="4.4"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5"/>',
    partly: '<circle cx="7" cy="6.5" r="2.6"/><path d="M7 2.7v1.3M7 9v1.3M3.2 6.5h1.3M9.5 6.5h1.3M4.3 3.8l.9.9M8.8 8.3l.9.9M4.3 9.2l.9-.9M8.8 4.7l.9-.9"/>' +
            '<g transform="translate(5,6) scale(0.75)">' + CLOUD + '</g>',
    cloud: '<g transform="translate(0,-1) scale(0.98)">' + CLOUD + '</g>',
    fog: CLOUD_UP + '<path d="M4.5 18.5h15M7 22h10"/>',
    rain: CLOUD_UP + '<path d="M8.5 17.5l-1.4 3.4M12.5 17.5l-1.4 3.4M16.5 17.5l-1.4 3.4"/>',
    snow: CLOUD_UP +
      '<circle cx="8.5" cy="18.8" r="1.05" fill="currentColor" stroke="none"/>' +
      '<circle cx="12.5" cy="21" r="1.05" fill="currentColor" stroke="none"/>' +
      '<circle cx="16.5" cy="18.8" r="1.05" fill="currentColor" stroke="none"/>',
    storm: CLOUD_UP + '<path d="M13 15.8l-2.5 3.5h2.9l-2.3 3.9"/>'
  };

  // iconstyle:"color" — the one D32 exception, chosen explicitly in the
  // editor: fixed hues tuned for the dark theme, same shapes as above.
  var C_SUN = "#f5b840", C_CLD = "#c9d3e0", C_RAIN = "#4da6ff",
      C_SNOW = "#dceeff", C_FOG = "#9fb0c4";
  var CLOUD_F = '<path d="' + CLOUD_D + '" fill="' + C_CLD + '" stroke="' + C_CLD + '"/>';
  var CLOUD_FUP = '<g transform="translate(0,-3) scale(0.88)">' + CLOUD_F + '</g>';
  var ICONS_COLOR = {
    sun: '<circle cx="12" cy="12" r="4.4" fill="' + C_SUN + '" stroke="' + C_SUN + '"/>' +
         '<path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5" fill="none" stroke="' + C_SUN + '"/>',
    partly: '<circle cx="7" cy="6.5" r="2.6" fill="' + C_SUN + '" stroke="' + C_SUN + '"/>' +
            '<path d="M7 2.7v1.3M7 9v1.3M3.2 6.5h1.3M9.5 6.5h1.3M4.3 3.8l.9.9M8.8 8.3l.9.9M4.3 9.2l.9-.9M8.8 4.7l.9-.9" fill="none" stroke="' + C_SUN + '"/>' +
            '<g transform="translate(5,6) scale(0.75)">' + CLOUD_F + '</g>',
    cloud: '<g transform="translate(0,-1) scale(0.98)">' + CLOUD_F + '</g>',
    fog: CLOUD_FUP + '<path d="M4.5 18.5h15M7 22h10" fill="none" stroke="' + C_FOG + '"/>',
    rain: CLOUD_FUP + '<path d="M8.5 17.5l-1.4 3.4M12.5 17.5l-1.4 3.4M16.5 17.5l-1.4 3.4" fill="none" stroke="' + C_RAIN + '"/>',
    snow: CLOUD_FUP +
      '<circle cx="8.5" cy="18.8" r="1.05" fill="' + C_SNOW + '" stroke="none"/>' +
      '<circle cx="12.5" cy="21" r="1.05" fill="' + C_SNOW + '" stroke="none"/>' +
      '<circle cx="16.5" cy="18.8" r="1.05" fill="' + C_SNOW + '" stroke="none"/>',
    storm: CLOUD_FUP + '<path d="M13 15.8l-2.5 3.5h2.9l-2.3 3.9" fill="' + C_SUN + '" stroke="' + C_SUN + '"/>'
  };
  var ICON_OF = {0: "sun", 1: "partly", 2: "partly", 3: "cloud",
                 45: "fog", 48: "fog",
                 51: "rain", 53: "rain", 55: "rain",
                 56: "rain", 57: "rain",
                 61: "rain", 63: "rain", 65: "rain", 66: "rain", 67: "rain",
                 71: "snow", 73: "snow", 75: "snow", 77: "snow",
                 80: "rain", 81: "rain", 82: "rain",
                 85: "snow", 86: "snow",
                 95: "storm", 96: "storm", 99: "storm"};

  var STYLE = OPTS.iconstyle === "color" ? "color" : "simple";

  function iconSvg(code, px) {
    var map = STYLE === "color" ? ICONS_COLOR : ICONS;
    if (code == null || !map[ICON_OF[code]]) return "";
    return '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px +
      '" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      map[ICON_OF[code]] + '</svg>';
  }

  function el(id) { return document.getElementById(id); }
  function tempStr(c) {
    if (c == null) return "—";             // no measurement — never a fake zero
    return Math.round(isF ? c * 9 / 5 + 32 : c) + "°";
  }
  function wmoLabel(code) {
    return (code == null || WMO[code] == null) ? "—" : WMO[code];
  }
  function reset(hint) {                   // honest empty state, never zeros
    el("temp").textContent = "—";
    el("unit").textContent = "";
    el("cond").textContent = "—";
    el("wicon").innerHTML = "";
    el("hilo").textContent = "";
    el("fc").textContent = "";
    el("place").textContent = hint;
  }

  // Slot-fit sizing: one scale factor derived from the slot the widget is
  // actually in (the clock sizes its face to the slot each tick — same
  // contract). The px values in the markup are the scale=1 ceiling; fit()
  // only shrinks, so they stay the largest this slot allows.
  var BASE_BIG = parseFloat(getComputedStyle(el("temp").parentNode).fontSize) || 0;
  var scale = 1;
  function px(v) { return Math.round(v * scale * 10) / 10; }
  function applyScale() {
    if (BASE_BIG) el("temp").parentNode.style.fontSize = px(BASE_BIG) + "px";
    el("unit").style.fontSize = px(18) + "px";
    el("cond").style.fontSize = px(54) + "px";
    el("place").style.fontSize = px(42) + "px";
    el("hilo").style.fontSize = px(42) + "px";
    el("fc").style.fontSize = px(48) + "px";
    ["cond", "place", "hilo"].forEach(function (id) {
      el(id).style.marginRight = px(205) + "px";
    });
    el("wicon").style.width = el("wicon").style.height = px(200) + "px";
    var m = el("wicon").querySelector("svg");
    if (m) { m.setAttribute("width", px(200)); m.setAttribute("height", px(200)); }
    [].forEach.call(el("fc").querySelectorAll(".fc-ic"), function (b) {
      b.style.marginRight = px(20) + "px";
      b.style.verticalAlign = px(-10) + "px";
      var sv = b.querySelector("svg");
      if (sv) { sv.setAttribute("width", px(45)); sv.setAttribute("height", px(45)); }
    });
  }

  // Largest scale <= 1 whose content clears the slot vertically and keeps
  // every label on one line (nowrap + overflow:hidden holds the line count
  // steady; scrollWidth reveals what ellipsis would cut). The title and
  // paddings don't shrink with the scale, so each ratio undershoots a
  // little and a re-measure converges — three passes is plenty.
  function fit() {
    var card = el("card");
    var texts = [el("cond"), el("place"), el("hilo")]
      .concat([].slice.call(el("fc").children));
    texts.forEach(function (e) { e.style.textOverflow = "clip"; });
    scale = 1;
    for (var i = 0; i < 3; i++) {
      applyScale();
      var room = window.innerHeight - card.offsetTop;
      var need = Math.max(card.offsetHeight, px(200) + 2); // flow or the icon
      var f = room > 0 ? room / need : 0;
      texts.forEach(function (e) {
        if (e.scrollWidth > e.clientWidth) f = Math.min(f, e.clientWidth / e.scrollWidth);
      });
      if (f >= 1) break;
      scale = Math.max(0.3, scale * f);
    }
    texts.forEach(function (e) { e.style.textOverflow = "ellipsis"; });
    applyScale();
  }
  window.addEventListener("resize", fit);

  function rebuild(wx) { build(wx); fit(); }
  function build(wx) {
    if (!loc) {                            // designed idle: nothing configured
      reset("set a location in the editor");
      return;
    }
    if (!wx) {                             // configured, no observation yet
      reset("waiting for first observation…");
      return;
    }
    if (wx.state !== "ok") {               // honest error, values stay empty
      reset(wx.error || "unavailable");
      return;
    }
    var cur = wx.current || {};
    el("temp").textContent = tempStr(cur.temperature_2m);
    el("unit").textContent = isF ? "F" : "C";
    el("cond").textContent = wmoLabel(cur.weather_code);
    el("wicon").innerHTML = iconSvg(cur.weather_code, px(200));
    var res = wx.resolved || {};
    el("place").textContent =
      (res.name || loc) + (res.admin1 ? ", " + res.admin1 : "");
    var daily = wx.daily || {}, hilo = el("hilo"), fc = el("fc");
    hilo.textContent = "";
    fc.textContent = "";
    if (view === "current") return;
    var hi = (daily.temperature_2m_max || [])[0],
        lo = (daily.temperature_2m_min || [])[0];
    hilo.textContent = (hi == null && lo == null) ? ""
      : "H " + tempStr(hi) + "  L " + tempStr(lo);
    if (view !== "forecast") return;
    var times = daily.time || [];
    for (var i = 0; i < times.length && i < 3; i++) {
      // noon parse: a bare date is local, +T12:00 dodges the UTC-midnight shift
      var d = new Date(times[i] + "T12:00:00");
      var row = document.createElement("div");
      var ic = iconSvg((daily.weather_code || [])[i], px(45));
      if (ic) {
        var badge = document.createElement("span");
        badge.className = "fc-ic";
        badge.innerHTML = ic;
        row.appendChild(badge);
      }
      row.appendChild(document.createTextNode(
        (i === 0 ? "Today" : DOW[d.getDay()]) + "  " +
        tempStr((daily.temperature_2m_max || [])[i]) + "/" +
        tempStr((daily.temperature_2m_min || [])[i]) + "  " +
        wmoLabel((daily.weather_code || [])[i])));
      fc.appendChild(row);
    }
  }

  var lastSig = null;
  window.tlcd.onMetrics(function (state, data) {
    if (state === "stale") return;         // D23: keep last values, boot dims the body
    var wx = (data.weather || {})[loc];
    // Weather can go old while the platform is live: the age dim runs every
    // tick (idempotent toggle), on the card — never on body, boot.js owns that.
    el("card").classList.toggle("tlcd-stale",
      !!wx && wx.state === "ok" && Date.now() / 1000 - wx.ts > wx.ttl);
    // Values rebuild only when the entry changed (ts moves on refetch): the
    // other 59 ticks of a TTL period are no-ops, no flicker.
    var sig = wx ? wx.state + "|" + wx.ts : "";
    if (sig === lastSig) return;
    lastSig = sig;
    rebuild(wx);
  });
</script>
</body>
</html>
