<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/widgets/theme.css">
<script src="/widgets/boot.js"></script>
</head>
<body>
  <div class="tlcd-title">LLM-TASKS</div>
  <div id="row" class="tlcd-dim-text" style="font-size:15px; line-height:1.5">
    &mdash;
  </div>
<script>
  // T26: the sampler orders loaded models first, then LLM workers by RSS;
  // the slot fits three 15px lines, so overflow collapses into a +N line.
  window.tlcd.onMetrics(function (state, data) {
    if (state === "stale") return;             // D23: dim + badge, keep last values
    var tasks = data.llm_tasks;
    if (tasks == null) return;                 // source not wired yet — never fake
    var row = document.getElementById("row");
    if (!tasks.length) {
      row.textContent = "no active tasks";
      return;
    }
    row.textContent = "";
    var shown = tasks.length > 3 ? 2 : tasks.length;
    for (var i = 0; i < shown; i++) {
      var t = tasks[i] || {};
      var line = document.createElement("div");
      line.textContent = (t.name || t.id || "task") + (t.status ? " · " + t.status : "");
      row.appendChild(line);
    }
    if (tasks.length > 3) {
      var more = document.createElement("div");
      more.textContent = "+" + (tasks.length - 2) + " more";
      row.appendChild(more);
    }
  });
</script>
</body>
</html>
