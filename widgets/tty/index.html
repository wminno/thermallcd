<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/widgets/theme.css">
<script src="/widgets/boot.js"></script>
</head>
<body>
  <div class="tlcd-title" id="title" style="overflow:hidden; white-space:nowrap;
       text-overflow:ellipsis">TTY</div>
  <div id="msg" class="tlcd-dim-text" style="font-size:15px">&mdash;</div>
  <img id="shot" alt="tty" style="display:none; width:100%; height:auto;
       border-radius:4px;">
<script>
  // tty widget (T18): the platform runs this placement's command (per-
  // instance option, T17) in a pty sized to the slot and serves it as a
  // transparent PNG. This iframe sends nothing but its token — the server
  // derives both the pane and the command from the layout (D19: viewers
  // never nominate the pane's size or command).
  var cmd = ((window.TLCD_OPTIONS && window.TLCD_OPTIONS.cmd) || "").trim();
  var img = document.getElementById("shot");
  var msg = document.getElementById("msg");
  if (cmd) document.getElementById("title").textContent = "TTY — " + cmd;
  var lastUrl = null;

  function tooSmall() {
    // below the 2x1 floor the terminal grid is unreadable — say so (D19)
    return window.innerWidth < 300 || window.innerHeight < 110;
  }

  function refresh() {
    if (!cmd) {
      img.style.display = "none";
      msg.style.display = "block";
      msg.textContent = "set a command in this widget's options";
      return;
    }
    if (tooSmall()) {
      img.style.display = "none";
      msg.style.display = "block";
      msg.textContent = "too small — enlarge the widget";
      return;
    }
    var TOKEN = window.TLCD_TOKEN || "";
    fetch("/api/tty?token=" + encodeURIComponent(TOKEN))
      .then(function (r) {
        if (!r.ok) throw new Error("tty " + r.status);
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        img.src = url;
        img.style.display = "block";
        msg.style.display = "none";
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = url;
      })
      .catch(function () {
        img.style.display = "none";
        msg.style.display = "block";
        msg.textContent = "tty unavailable";
      });
  }

  window.tlcd.onMetrics(function (state) {
    // metrics drive the stale contract (D23); the image polls on its own beat
    if (state === "stale") return;
    refresh();
  });
  setInterval(refresh, 2000);
  window.tlcd.ready(refresh);
</script>
</body>
</html>
