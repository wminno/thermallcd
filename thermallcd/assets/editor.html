<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thermallcd — editor</title>
<link rel="stylesheet" href="/widgets/theme.css">
<link rel="stylesheet" href="/assets/vendor/gridstack.min.css">
<style>
  html, body { margin: 0; height: 100vh; }
  body {
    display: flex; flex-direction: column;
    background:
      radial-gradient(120% 160% at 18% 110%, #2a0f3f 0%, rgba(42,15,63,0) 55%),
      linear-gradient(180deg, #07060d 0%, #0d0821 55%, #160b2e 78%, #1d0f38 100%);
    font-family: var(--tlcd-font-mono, monospace);
    color: var(--tlcd-text);
  }
  :focus-visible { outline: 2px solid var(--tlcd-accent); outline-offset: 2px; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--tlcd-line);
    background: rgba(15, 11, 29, .82);
  }
  header h1 { font-size: 15px; letter-spacing: .12em; margin: 0; flex: 1; }
  .btn {
    min-height: 44px; min-width: 44px;
    background: var(--tlcd-field); color: var(--tlcd-text);
    border: 1px solid var(--tlcd-line); border-radius: 4px;
    font: inherit; font-size: 13px; letter-spacing: .06em;
    padding: 8px 14px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--tlcd-accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  #save { background: var(--tlcd-accent); color: #160b1e; font-weight: 700;
          border: 0; position: relative; }
  #save .dot { display: none; position: absolute; top: 6px; right: 6px;
               width: 8px; height: 8px; border-radius: 50%; background: #160b1e; }
  #save.dirty .dot { display: block; }
  #palette-toggle { display: none; }

  .shell { display: flex; flex: 1; min-height: 0; }
  aside {
    width: 240px; flex-shrink: 0; overflow-y: auto;
    border-right: 1px solid var(--tlcd-line);
    background: rgba(15, 11, 29, .82);
    padding: 12px;
  }
  aside h2 { font-size: 12px; letter-spacing: .14em; color: var(--tlcd-dim);
             margin: 4px 4px 12px; }
  .palette-item {
    display: block; width: 100%; box-sizing: border-box; min-height: 44px;
    background: var(--tlcd-surface-2); color: var(--tlcd-text);
    border: 1px solid var(--tlcd-line); border-radius: 4px;
    font: inherit; font-size: 13px; text-align: left;
    padding: 10px 12px; margin: 0 0 8px; cursor: pointer;
  }
  .palette-item:hover:not(.invalid) { border-color: var(--tlcd-accent); }
  .palette-item .badge {
    float: right; color: var(--tlcd-dim); font-size: 11px;
    border: 1px solid var(--tlcd-line); border-radius: 3px; padding: 1px 5px;
  }
  .palette-item.invalid { cursor: default; opacity: .85; }
  .palette-item:disabled { opacity: .35; cursor: default; }
  .palette-item.invalid .reason {
    color: var(--tlcd-warn); font-size: 11px; margin-top: 6px; line-height: 1.4;
  }

  .canvas-scroll { flex: 1; overflow-x: auto; padding: 24px 16px; }
  .canvas {
    position: relative; width: 960px; height: 231px; margin: 0 auto;
    border: 1px solid var(--tlcd-line); border-radius: 4px;
    background: #07060d;
  }
  .canvas iframe {
    border: 0; position: absolute; left: 0; top: 0;
    width: 1920px; height: 462px;
    transform: scale(.5); transform-origin: 0 0;
    pointer-events: none;             /* drags go to the overlay, not the preview */
  }
  /* GridStack overlay: dashboard grid (inset 16, gap 8, tracks 150x138) shown
     at SCALE — the script below drives the real numbers from that one knob;
     these 0.5x fallbacks match SCALE = 0.5. Pitch is the dashboard cell pitch
     (158x146) times SCALE; GridStack keeps its margins INSIDE item boxes, so
     margin = 4*SCALE makes item content land exactly on dashboard track
     origins. The background paints ~those content cells: a track-sized fill
     inside each pitch tile, offset 2px — free space lights up, gutters dark. */
  #tlcd-canvas {
    position: absolute; left: 6px; top: 6px; width: 948px; height: 219px;
    background-image:
      linear-gradient(90deg, transparent 2px, rgba(143, 135, 174, .09) 2px,
        rgba(143, 135, 174, .09) calc(100% - 2px), transparent calc(100% - 2px)),
      linear-gradient(180deg, transparent 2px, rgba(143, 135, 174, .09) 2px,
        rgba(143, 135, 174, .09) calc(100% - 2px), transparent calc(100% - 2px));
    background-size: 79px 73px;
  }
  .grid-stack-placeholder > .placeholder-content {
    background: rgba(255, 46, 131, .16);      /* accent tint over the cells */
    outline: 1px dashed var(--tlcd-accent);   /* the widget will land here */
  }
  .grid-stack-item .grid-stack-item-content { overflow: visible; }
  .tlcd-tag {
    position: absolute; left: 2px; top: 2px;
    font-size: 9px; letter-spacing: .1em; color: var(--tlcd-dim);
    background: rgba(7, 6, 13, .65); border-radius: 3px; padding: 1px 5px;
    pointer-events: none;
  }
  .grid-stack-item.tlcd-selected .grid-stack-item-content {
    outline: 2px solid var(--tlcd-accent); outline-offset: -2px;
  }
  .tlcd-del {
    position: absolute; right: 2px; top: 2px; z-index: 10;
    width: 44px; height: 44px;
    background: rgba(7, 6, 13, .75); color: var(--tlcd-warn);
    border: 1px solid var(--tlcd-line); border-radius: 4px;
    font: inherit; font-size: 15px; cursor: pointer;
  }
  /* T17: per-widget view options, offered while the widget is selected */
  .tlcd-opts {
    position: absolute; right: 2px; top: 52px; z-index: 10;
    background: rgba(7, 6, 13, .88); border: 1px solid var(--tlcd-line);
    border-radius: 4px; padding: 6px 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tlcd-opts label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--tlcd-dim); white-space: nowrap;
  }
  .tlcd-opts select, .tlcd-opts input {
    font: inherit; font-size: 11px; color: var(--tlcd-text);
    background: var(--tlcd-field); border: 1px solid var(--tlcd-line);
    border-radius: 3px; padding: 2px 4px; max-width: 180px;
  }
  /* T20: geocode suggestions under a place-name option input */
  .tlcd-sug {
    position: absolute; z-index: 11; min-width: 180px; max-height: 140px;
    overflow-y: auto; background: rgba(7, 6, 13, .95);
    border: 1px solid var(--tlcd-line); border-radius: 4px;
  }
  .tlcd-sug-row {
    padding: 3px 6px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .tlcd-sug-row.tlcd-sug-on { background: var(--tlcd-accent); }
  .tlcd-sug-row .tlcd-sug-sub { color: var(--tlcd-dim); }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--tlcd-surface-2); color: var(--tlcd-text);
    border: 1px solid var(--tlcd-accent); border-radius: 4px;
    padding: 12px 18px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
  }
  #toast.show { opacity: 1; }

  /* T13 flair picker: scene thumbnails are real flair.js renders (D29) */
  .flair-thumb {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--tlcd-line); border-radius: 4px;
    cursor: pointer; padding: 0; background: #07060d;
  }
  .flair-thumb:hover { border-color: var(--tlcd-accent); }
  .flair-thumb.selected { outline: 2px solid var(--tlcd-accent); outline-offset: -1px; }
  .flair-row {
    display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
  }
  .flair-row label { font-size: 12px; color: var(--tlcd-dim); flex: 1; }
  .flair-row select, .flair-row input[type="range"] {
    flex: 2; min-height: 32px; background: var(--tlcd-field);
    color: var(--tlcd-text); border: 1px solid var(--tlcd-line);
    border-radius: 4px; font: inherit; font-size: 12px; padding: 4px 6px;
  }
  /* T27: rotate interval number input */
  .flair-row input[type="number"] {
    flex: 2; min-height: 32px; width: 72px; background: var(--tlcd-field);
    color: var(--tlcd-text); border: 1px solid var(--tlcd-line);
    border-radius: 4px; font: inherit; font-size: 12px; padding: 4px 6px;
  }
  .flair-check {
    display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
    font-size: 12px; color: var(--tlcd-text); cursor: pointer;
  }
  .flair-check input { width: 16px; height: 16px; accent-color: var(--tlcd-accent); }

  /* D34: below 1024px the palette collapses to a toggleable drawer */
  @media (max-width: 1023px) {
    #palette-toggle { display: block; }
    aside {
      position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
      transform: translateX(-100%); transition: transform .2s;
    }
    aside.open { transform: translateX(0); }
  }
</style>
</head>
<body>
<header>
  <button id="palette-toggle" class="btn" aria-label="toggle palette">☰</button>
  <h1>THERMALLCD · EDITOR</h1>
  <select id="page-select" class="btn" aria-label="page being edited" hidden></select>
  <select id="device-select" class="btn" hidden
          aria-label="panel being edited"></select>
  <select id="zoom" class="btn" aria-label="preview zoom"></select>
  <button id="undo" class="btn" disabled>UNDO</button>
  <button id="redo" class="btn" disabled>REDO</button>
  <button id="save" class="btn">SAVE<span class="dot"></span></button>
</header>
<div class="shell">
  <aside id="palette"><h2>WIDGETS</h2></aside>
  <div class="canvas-scroll">
    <div class="canvas">
      <iframe src="/" title="live dashboard preview"></iframe>
      <div id="tlcd-canvas"></div>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>
<!-- gridstack-all.js is the UMD bundle: defines the GridStack global -->
<script src="/assets/vendor/gridstack.min.js"></script>
<!-- flair engine: the editor only paints scene thumbnails with it
     (TLCDFlair.paintThumb); the live scene runs inside the preview iframe -->
<script src="/assets/flair.js"></script>
<script>
"use strict";
// -- editor zoom: the user picks the preview magnification (persisted in
// localStorage). The 1920x462 panel is shown at SCALE; a dashboard cell
// pitches 158x146 real px (150x138 track + 8 gutter), so the GridStack pitch
// is that times SCALE and the margin is 4*SCALE so item content is exactly a
// scaled dashboard track.
var ZOOMS = [40, 50, 65, 75, 85, 100];
var SCALE = 0.65;
try {
  var storedZoom = parseInt(localStorage.getItem("tlcd-editor-zoom"), 10);
  if (ZOOMS.indexOf(storedZoom) >= 0) SCALE = storedZoom / 100;
} catch (e) {}

function applyScale() {
  var canvas = document.querySelector(".canvas");
  canvas.style.width = 1920 * SCALE + "px";
  canvas.style.height = 462 * SCALE + "px";
  canvas.querySelector("iframe").style.transform = "scale(" + SCALE + ")";
  var g = document.getElementById("tlcd-canvas");
  g.style.left = g.style.top = 12 * SCALE + "px";   // inset 16*SCALE less the margin
  g.style.width = 12 * 158 * SCALE + "px";
  g.style.height = 3 * 146 * SCALE + "px";
  g.style.backgroundSize = 158 * SCALE + "px " + 146 * SCALE + "px";
}
applyScale();

function makeGrid() {
  var g = GridStack.init({
    column: 12,
    cellHeight: 146 * SCALE, // dashboard rows: 138px track + 8 gutter, scaled
    margin: 4 * SCALE,       // inside item boxes: content is a scaled track
    acceptWidgets: ".palette-item",  // palette drag-in: creates the grid's
                                     // droppable so an external drop can land
    minRow: 3, maxRow: 3,    // the panel is a fixed 12x3 (D33)
    float: true,
    disableOneColumnMode: true,
  }, "#tlcd-canvas");
  g.on("change", settle);
  g.on("added", settle);                        // palette drag-in drop
  g.on("removed", function () { snapshot(); }); // deletions may not fire change
  g.on("removed", function (ns) {               // T17 hygiene
    ns.forEach(function (n) { itemOptions.delete(n.el); });
  });
  return g;
}
var grid = makeGrid();

// -- zoom picker: gridstack bakes the pitch into its container at init, so a
// new magnification rebuilds it — the arrangement and per-instance options
// ride across (same strip-and-rekey as undo/redo)
(function initZoom() {
  var sel = document.getElementById("zoom");
  ZOOMS.forEach(function (p) {
    var o = document.createElement("option");
    o.value = String(p);
    o.textContent = p + "%";
    sel.appendChild(o);
  });
  sel.value = String(Math.round(SCALE * 100));
  sel.addEventListener("change", function () {
    var s = parseInt(sel.value, 10) / 100;
    if (s === SCALE) return;
    SCALE = s;
    try { localStorage.setItem("tlcd-editor-zoom", String(s)); } catch (e) {}
    loading = true;
    try {
      var w = nodes();             // arrangement + options, captured first
      var oldG = document.getElementById("tlcd-canvas");
      grid.destroy();              // v12 removes the container element too
      if (oldG && oldG.isConnected) oldG.remove();
      var fresh = document.createElement("div");
      fresh.id = "tlcd-canvas";
      document.querySelector(".canvas").appendChild(fresh);
      applyScale();                // scale geometry onto the fresh container
      grid = makeGrid();
      grid.load(w.map(function (n) {
        var c = Object.assign({}, n); delete c.options; return c;
      }));
      itemOptions.clear();
      w.forEach(function (x) {
        if (x.options && Object.keys(x.options).length) {
          grid.engine.nodes.forEach(function (n) {
            if (n.id === x.id) itemOptions.set(n.el, x.options);
          });
        }
      });
    } finally {
      loading = false;             // never strand settle/snapshot as no-ops
    }
    deselect();
    updateChrome();
    pushPreview();
  });
})();

var hist = [], ptr = -1, baselineJson = null, loading = false;
var selected = null;
// T17 per-instance options: keyed by the grid item element (gridstack nodes
// never carry custom fields reliably across load/undo) — nodes() joins them
// back in by element, applyHistory rebuilds the map after grid.load
var itemOptions = new Map();
var widgetsByName = {};

// T28 widget pages: per-page widget lists held unsaved (the pendingFlair
// pattern). The active page's list IS the live grid; cycle_min 0 = off.
var pendingPages = [], activePage = 0, pendingCycleMin = 0;

var paletteBtns = {};   // widget name -> palette button (disabled once placed)
var gridEl = document.getElementById("tlcd-canvas");
var saveBtn = document.getElementById("save");
var undoBtn = document.getElementById("undo");
var redoBtn = document.getElementById("redo");
var toast = document.getElementById("toast");

function nodes() {
  // read the live nodes, not grid.save(): optimized save output omits w/h
  // when they hit defaults (h = 1, w reaching the last column), and the
  // server rejects layouts without integer w/h. Per-instance options (T17)
  // live in itemOptions — gridstack nodes never carry them.
  return grid.engine.nodes.map(function (n) {
    return {
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h,
      options: itemOptions.get(n.el) || undefined
    };
  });
}

// -- T18 placement guard: the panel is a fixed 12x3, but gridstack v12
// lets an external drag-in land past it (maxRow is not enforced on
// drops), so check explicitly and reject the move instead of growing a
// fourth row.
function outOfBounds(n) {
  return n.x < 0 || n.y < 0 || n.x + n.w > 12 || n.y + n.h > 3;
}

function settle(added) {
  if (loading) return;
  var bad = null;
  grid.engine.nodes.forEach(function (n) {   // float mode can displace others
    if (!bad && outOfBounds(n)) bad = n;
  });
  (added || []).forEach(function (n) { if (outOfBounds(n)) bad = n; });
  if (!bad) { snapshot(); return; }
  var s = historyEntry();
  if (hist[ptr] === s) {
    // the stored layout itself is out of bounds — drop the node, don't loop
    setTimeout(function () { grid.removeWidget(bad.el); }, 0);
  } else {
    // hist top is still the last arrangement that fit — reload it (the
    // timeout lets the in-flight drop event finish before the revert)
    setTimeout(function () { applyHistory(ptr); }, 0);
  }
  showToast("no room — a " + bad.w + "x" + bad.h + " grid is needed to place " + bad.id);
}

// -- T15 device scope: which panel this editor edits. Every layout
// fetch/save and the live preview iframe ride it; the selector (below)
// appears only when more than one panel reports online.
var DEVICE = new URLSearchParams(location.search).get("device") || "default";
function layoutUrl() {
  return "/api/layout?device=" + encodeURIComponent(DEVICE);
}

// -- live preview: every layout change is pushed into the preview iframe,
// which repositions its widget frames in place — widgets visibly move as
// you edit, before any save. The dashboard's own 1 s layout poll stays
// authoritative for SAVED changes; this only mirrors the editing state.
var previewFrame = document.querySelector(".canvas iframe");
// always embed: the dashboard's T28 page-cycle timer must not run inside
// the editor preview — it would fight the postMessage pushes for the canvas
previewFrame.src = "/?embed=1" +
  (DEVICE !== "default" ? "&device=" + encodeURIComponent(DEVICE) : "");

// -- T15: an editor opened without ?device= edits the default layout, but a
// single-panel setup renders its own device file — the two split the first
// time a device-addressed save forked the layout, and the selector that
// would show the scope stays hidden below two panels. Exactly one known
// device is adopted; an explicit param always wins and 0 or 2+ devices keep
// the default scope (the selector handles the multi-panel case).
var adoptDevice = new URLSearchParams(location.search).get("device")
  ? Promise.resolve()
  : fetch("/api/devices")
      .then(function (r) { return r.json(); })
      .then(function (doc) {
        var devices = (doc && doc.devices) || [];
        if (devices.length !== 1) return;
        DEVICE = devices[0].id;
        // keep the URL truthful for reloads and shares
        var qs = new URLSearchParams(location.search);
        qs.set("device", DEVICE);
        history.replaceState(null, "", location.pathname + "?" + qs);
        // the preview iframe already loaded the default scope — re-point it
        previewFrame.src = "/?embed=1&device=" + encodeURIComponent(DEVICE);
      })
      .catch(function () {});
var layoutReady = false;
var pendingFlair = null;   // T13: flair rides the same push + save path
function pushPreview() {
  // before the initial layout load the server render already matches the
  // grid — pushing the empty grid would needlessly drop every frame
  if (!layoutReady) return;
  previewFrame.contentWindow.postMessage(
    { tlcdPreview: { widgets: nodes(), flair: pendingFlair } }, location.origin);
}
previewFrame.addEventListener("load", pushPreview);  // post-save reload re-pushes
// a push lost while the preview reloads (its message listener is briefly
// absent) would otherwise leave the preview stale until the next edit —
// re-pushing makes the preview eventually-consistent with the editor
setInterval(pushPreview, 2000);

// -- T28 pages: one history entry spans every page plus the cycle timing,
// so undo/redo and the dirty dot work across page switches --
function mergedPages() {
  return pendingPages.map(function (p, i) {
    return i === activePage ? { name: p.name, widgets: nodes() } : p;
  });
}
function historyEntry() {
  return JSON.stringify({ pages: mergedPages(), cycle_min: pendingCycleMin,
                          page: activePage });
}

function snapshot() {
  if (loading) return;
  var s = historyEntry();
  if (ptr >= 0 && hist[ptr] === s) return;   // dedupe double-fire events
  hist = hist.slice(0, ptr + 1);
  hist.push(s);
  if (hist.length > 50) hist.shift();
  ptr = hist.length - 1;
  updateChrome();
  pushPreview();
}

function applyHistory(nextPtr) {
  var h = JSON.parse(hist[nextPtr]);
  pendingPages = h.pages;
  pendingCycleMin = h.cycle_min;
  ptr = nextPtr;
  // switchToPage loads the entry's page list, re-keys the options map and
  // manages the loading guard; merge=false — the entry's list is already
  // the truth, folding the live grid back would corrupt the restore
  switchToPage(h.page || 0, false);
  updateChrome();
}

// -- T28 page switching: the active page's widget list IS the live grid --
function switchToPage(idx, merge) {
  loading = true;
  try {
    deselect();
    if (merge !== false) {   // default: fold the live grid into the page
      pendingPages[activePage] = { name: pendingPages[activePage].name,
                                   widgets: nodes() };
    }
    activePage = Math.min(Math.max(0, idx | 0), pendingPages.length - 1);
    var page = pendingPages[activePage];
    // gridstack nodes don't carry custom fields through load() — strip
    // options for the load, then re-key them onto the fresh elements;
    // minW/minH carry too (a load without them lets gridstack shrink
    // items the registry floors at a larger minimum)
    grid.load(page.widgets.map(function (w) {
      var n = Object.assign({}, w);
      delete n.options;
      var reg = widgetsByName[w.id];
      if (reg && reg.min) { n.minW = reg.min.w; n.minH = reg.min.h; }
      return n;
    }));
    itemOptions.clear();
    page.widgets.forEach(function (w) {
      if (w.options && Object.keys(w.options).length) {
        grid.engine.nodes.forEach(function (n) {
          if (n.id === w.id) itemOptions.set(n.el, w.options);
        });
      }
    });
    renderChips();
  } finally {
    loading = false;
  }
  updateChrome();
  renderPagesUI();
  pushPreview();
}

function updateChrome() {
  undoBtn.disabled = ptr <= 0;
  redoBtn.disabled = ptr >= hist.length - 1;
  saveBtn.classList.toggle("dirty", ptr >= 0 && hist[ptr] !== baselineJson);
  // one instance per widget type per page: ids are registry names, and
  // the render path skips any layout id that is not one — a widget can
  // live on several pages (same options = same frame), but not twice on one
  var placed = {};
  nodes().forEach(function (n) { placed[n.id] = true; });
  Object.keys(paletteBtns).forEach(function (name) {
    var btn = paletteBtns[name];
    var on = !!placed[name];
    btn.disabled = on;
    btn.title = on ? name + " — already placed"
                   : (widgetsByName[name].description || name);
    btn.querySelector(".badge").textContent = on ? "placed" : btn.dataset.size;
  });
}

function markDirty() { updateChrome(); }

// T20: geocode suggestions for place-name options (spec.suggest ===
// "geocode"). Type to search, click a row or Enter to fill; a dead or
// short query just leaves the input alone. Rows pick on mousedown with
// preventDefault so the input keeps focus — no blur/close race.
function attachSuggest(ctl, box) {
  var dd = null, rows = [], idx = -1, timer = null;
  function close() {
    if (dd) { dd.remove(); dd = null; }
    rows = []; idx = -1;
  }
  function paint() {
    rows.forEach(function (r, i) {
      r.el.classList.toggle("tlcd-sug-on", i === idx);
    });
  }
  function pick(i) {
    ctl.value = rows[i].value;
    ctl.dispatchEvent(new Event("change", {bubbles: true}));
    close();
  }
  function show(sugs) {
    close();
    if (!sugs.length) return;
    dd = document.createElement("div");
    dd.className = "tlcd-sug";
    dd.style.left = ctl.offsetLeft + "px";
    dd.style.top = (ctl.offsetTop + ctl.offsetHeight + 2) + "px";
    sugs.forEach(function (s, i) {
      var row = document.createElement("div");
      row.className = "tlcd-sug-row";
      var name = document.createElement("span");
      name.textContent = s.label;
      row.appendChild(name);
      if (s.sub) {
        var sub = document.createElement("span");
        sub.className = "tlcd-sug-sub";
        sub.textContent = " · " + s.sub;
        row.appendChild(sub);
      }
      row.addEventListener("mousedown", function (e) {
        e.preventDefault();          // keep focus, skip the blur path
        e.stopPropagation();
        pick(i);
      });
      dd.appendChild(row);
      rows.push({el: row, value: s.value});
    });
    box.appendChild(dd);
    paint();
  }
  ctl.addEventListener("input", function () {
    clearTimeout(timer);
    var q = ctl.value.trim();
    if (q.length < 2) { close(); return; }
    timer = setTimeout(function () {
      fetch("/api/geocode?q=" + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (doc) {
          if (ctl.value.trim() !== q) return;  // a newer keystroke owns the box
          show((doc && doc.suggestions) || []);
        })
        .catch(close);
    }, 250);
  });
  ctl.addEventListener("keydown", function (e) {
    if (!dd) return;
    if (e.key === "ArrowDown") {
      idx = Math.min(idx + 1, rows.length - 1); paint(); e.preventDefault();
    } else if (e.key === "ArrowUp") {
      idx = Math.max(idx - 1, 0); paint(); e.preventDefault();
    } else if (e.key === "Enter") {
      if (rows[idx]) { e.preventDefault(); pick(idx); }
    } else if (e.key === "Escape") {
      close(); e.stopPropagation();   // close the list, keep the widget selected
    }
  });
  ctl.addEventListener("blur", close);
}

// -- selection + delete (D31: click-to-select, delete button on the card) --
function deselect() {
  if (selected) {
    selected.el.classList.remove("tlcd-selected");
    var del = selected.el.querySelector(".tlcd-del");
    if (del) del.remove();
    var opts = selected.el.querySelector(".tlcd-opts");
    if (opts) opts.remove();
  }
  selected = null;
}
function select(itemEl) {
  deselect();
  if (!itemEl) return;
  itemEl.classList.add("tlcd-selected");
  var b = document.createElement("button");
  b.className = "tlcd-del";
  b.title = "remove widget";
  b.textContent = "✕";
  // keep GridStack's item-drag machinery from swallowing the press
  b.addEventListener("mousedown", function (e) { e.stopPropagation(); });
  b.addEventListener("click", function () { grid.removeWidget(itemEl); });
  itemEl.querySelector(".grid-stack-item-content").appendChild(b);
  // T17: the widget's manifest options render as a small popover; a change
  // rewrites the instance's options and the preview refetches the frame
  var node = null;
  grid.engine.nodes.forEach(function (n) { if (n.el === itemEl) node = n; });
  var specs = (node && widgetsByName[node.id] &&
               widgetsByName[node.id].options) || [];
  if (specs.length) {
    var box = document.createElement("div");
    box.className = "tlcd-opts";
    specs.forEach(function (spec) {
      var lab = document.createElement("label");
      lab.textContent = spec.label || spec.key;
      var ctl;
      if (spec.type === "text") {
        ctl = document.createElement("input");
        ctl.type = "text";
        ctl.placeholder = spec.placeholder || "default";
        if (spec.suggest === "geocode") attachSuggest(ctl, box);
      } else {
        ctl = document.createElement("select");
        var empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "(default)";
        ctl.appendChild(empty);
        (spec.choices || []).forEach(function (ch) {
          var o = document.createElement("option");
          o.value = ch.value;
          o.textContent = ch.label || ch.value;
          ctl.appendChild(o);
        });
      }
      var cur = (itemOptions.get(itemEl) || {})[spec.key];
      if (cur != null) ctl.value = cur;
      ctl.addEventListener("change", function () {
        var opts = Object.assign({}, itemOptions.get(itemEl) || {});
        if (ctl.value === "") delete opts[spec.key];
        else opts[spec.key] = ctl.value;
        itemOptions.set(itemEl, opts);
        snapshot();   // rides undo/redo history; pushPreview refetches the frame
      });
      lab.appendChild(ctl);
      box.appendChild(lab);
    });
    // the box swallows mousedown so GridStack's item-drag machinery never
    // swallows the press that focuses a control (the delete button does the same)
    box.addEventListener("mousedown", function (e) { e.stopPropagation(); });
    itemEl.querySelector(".grid-stack-item-content").appendChild(box);
  }
  selected = { el: itemEl };
}
gridEl.addEventListener("click", function (e) {
  // a click inside the options popover is not a re-select: select() would
  // rebuild the box and steal the focus from the input being clicked
  if (e.target.closest(".tlcd-del") || e.target.closest(".tlcd-opts")) return;
  select(e.target.closest(".grid-stack-item"));
});

document.addEventListener("keydown", function (e) {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    if (selected) { grid.removeWidget(selected.el); deselect(); }
  } else if (e.key === "Escape") {
    deselect();
  } else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === "z") {
    e.preventDefault(); if (ptr > 0) applyHistory(ptr - 1);
  } else if (((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "z") ||
             ((e.ctrlKey || e.metaKey) && e.key === "y")) {
    e.preventDefault(); if (ptr < hist.length - 1) applyHistory(ptr + 1);
  }
});
undoBtn.addEventListener("click", function () { if (ptr > 0) applyHistory(ptr - 1); });
redoBtn.addEventListener("click", function () { if (ptr < hist.length - 1) applyHistory(ptr + 1); });

// -- save (D25 micro-states: dirty dot + toast) --
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(function () { toast.classList.remove("show"); }, 2500);
}
saveBtn.addEventListener("click", function () {
  fetch(layoutUrl(), {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pages: mergedPages(), cycle_min: pendingCycleMin,
                           flair: pendingFlair }),
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    baselineJson = hist[ptr];
    updateChrome();
    showToast("Saved — panel updates in ~2 s");
  }).catch(function () { showToast("Save failed — see server logs"); });
});

// -- palette (D25: valid widgets addable; malformed listed with reason) --
// item content: GridStack v12 renders `content` as TEXT, so chips are
// appended through the DOM instead of passed as markup
function renderChips() {
  gridEl.querySelectorAll(".grid-stack-item").forEach(function (el) {
    var node = el.gridstackNode;
    var box = el.querySelector(".grid-stack-item-content");
    var tag = box.querySelector(".tlcd-tag");
    if (!tag) {
      tag = document.createElement("div");
      tag.className = "tlcd-tag";
      box.appendChild(tag);
    }
    var w = widgetsByName[node && node.id];
    tag.textContent = w ? (w.title || w.name) : (node && node.id) || "";
  });
}

adoptDevice.then(function () {
  return fetch("/api/widgets");
}).then(function (r) { return r.json(); }).then(function (doc) {
  var aside = document.getElementById("palette");
  doc.widgets.forEach(function (w) {
    if (w.error) {
      var bad = document.createElement("div");
      bad.className = "palette-item invalid";
      bad.innerHTML = "<span></span><div class='reason'></div>";
      bad.querySelector("span").textContent = w.name;
      bad.querySelector(".reason").textContent = w.error;
      aside.appendChild(bad);
      return;
    }
    widgetsByName[w.name] = w;
    var btn = document.createElement("button");
    btn.className = "palette-item";
    btn.title = w.description || w.name;
    btn.dataset.size = w.size.w + "x" + w.size.h;
    paletteBtns[w.name] = btn;
    btn.innerHTML = "<span></span><span class='badge'></span>";
    btn.querySelector("span").textContent = (w.title || w.name);
    btn.querySelector(".badge").textContent = btn.dataset.size;
    btn.addEventListener("click", function () {
      var node = { id: w.name, w: w.size.w, h: w.size.h };
      if (w.min) { node.minW = w.min.w; node.minH = w.min.h; }
      grid.addWidget(node);
      renderChips();
    });
    aside.appendChild(btn);
  });

  // drag a palette entry straight onto the canvas — click-to-add still works.
  // The node carries the widget's size and id, so the dropped item lands at
  // the drop cell with the right footprint and saves under its registry name.
  // No `grid` backref: the drag layer wires the drop through the grid's
  // droppable (acceptWidgets above), and a node claiming this grid makes the
  // drop handler treat it as an internal move — the widget never lands.
  // Disabled (already placed) buttons get no pointer events, so they cannot
  // drag in either.
  var names = Object.keys(widgetsByName);
  GridStack.setupDragIn(names.map(function (n) { return paletteBtns[n]; }),
    { helper: "clone" },
    names.map(function (n) {
      var w = widgetsByName[n];
      var node = { id: n, w: w.size.w, h: w.size.h };
      if (w.min) { node.minW = w.min.w; node.minH = w.min.h; }
      return node;
    }));

  // layout loads only after the registry is known, so chips resolve titles
  return fetch(layoutUrl()).then(function (r) { return r.json(); });
}).then(function (doc) {
  initFlair(doc && doc.flair);
  initPagesUI();
  if (!doc) return;
  // T28: pages shape, with the flat doc wrapped for backward compat
  pendingPages = doc.pages ||
    [{ name: "Main", widgets: doc.widgets || [] }];
  pendingCycleMin = doc.cycle_min || 0;
  activePage = 0;
  switchToPage(0, false);
  snapshot();
  baselineJson = hist[ptr];
  updateChrome();
  layoutReady = true;
  pushPreview();
});

// -- T28 widget pages: sidebar section + header switcher --
// Per-page placement only (user decision): a widget appears on a page by
// being placed there; identical placement on every page reuses the same
// panel frame (same wid), so persistent widgets never reload on a flip.
var pagesEls = {};

function initPagesUI() {
  if (pagesEls.name) return;               // editor tab re-runs only on reload
  var aside = document.getElementById("palette");

  var h2 = document.createElement("h2");
  h2.textContent = "PAGES";
  aside.appendChild(h2);

  var sel = document.getElementById("page-select");
  sel.addEventListener("change", function () {
    var idx = Number(sel.value);
    if (pendingPages[idx] && idx !== activePage) {
      switchToPage(idx);
      snapshot();
    }
  });

  function row(labelText, control) {
    var wrap = document.createElement("div");
    wrap.className = "flair-row";
    var label = document.createElement("label");
    label.textContent = labelText;
    wrap.appendChild(label);
    wrap.appendChild(control);
    aside.appendChild(wrap);
    return control;
  }

  var cyc = document.createElement("input");
  cyc.type = "number"; cyc.min = "0"; cyc.step = "1";
  cyc.addEventListener("change", function () {
    pendingCycleMin = Math.max(0, Number(cyc.value) || 0);
    cyc.value = pendingCycleMin;
    snapshot();
  });
  pagesEls.cycle = row("cycle pages (min, 0 = off)", cyc);

  var name = document.createElement("input");
  name.type = "text"; name.maxLength = 40;
  name.addEventListener("change", function () {
    var page = pendingPages[activePage];
    var v = name.value.trim();
    if (!v || v.length > 40 ||
        pendingPages.some(function (p) { return p !== page && p.name === v; })) {
      name.value = page.name;
      showToast(!v ? "page name cannot be empty"
                   : v.length > 40 ? "page name is longer than 40 characters"
                   : "that page name is already used");
      return;
    }
    page.name = v;
    renderPagesUI();
    snapshot();
  });
  pagesEls.name = row("page name", name);

  var add = document.createElement("button");
  add.className = "palette-item";
  add.textContent = "+ add page";
  add.addEventListener("click", function () {
    var pname = "Page " + pendingPages.length, n = 2;
    while (pendingPages.some(function (p) { return p.name === pname; })) {
      pname = "Page " + pendingPages.length + "-" + n++;
    }
    pendingPages.push({ name: pname, widgets: [] });
    switchToPage(pendingPages.length - 1);
    snapshot();
  });
  aside.appendChild(add);

  var del = document.createElement("button");
  del.className = "palette-item";
  del.textContent = "delete page";
  del.disabled = true;
  del.addEventListener("click", function () {
    if (pendingPages.length < 2) return;    // the last page cannot go
    pendingPages.splice(activePage, 1);
    switchToPage(activePage - 1, false);    // no merge: the list is the truth
    snapshot();
  });
  aside.appendChild(del);
  pagesEls.del = del;
}

function renderPagesUI() {
  var sel = document.getElementById("page-select");
  sel.textContent = "";
  pendingPages.forEach(function (p, i) {
    var opt = document.createElement("option");
    opt.value = i;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.value = activePage;
  sel.hidden = false;
  if (pagesEls.name) {
    pagesEls.name.value = pendingPages[activePage].name;
    pagesEls.del.disabled = pendingPages.length < 2;
  }
}

// -- T13 flair picker (D29: thumbnail strip with live mini-previews) --
// Thumbnails are real flair.js renders of each scene in the current theme;
// the preview iframe runs the live scene, so every control here is visible
// in place before any save.
var flairThumbs = {};      // scene key -> canvas element
var flairEls = {};         // control elements by name

function flairMotionOptions(scene) {
  // scenes with a terrain corridor only drive forward/backward/still
  var allowed = window.TLCDFlair.SCENES[scene].motions || Object.keys(TLCDFlair.MOTIONS);
  return allowed.map(function (m) { return [m, TLCDFlair.MOTIONS[m]]; });
}

function refreshFlairThumbs() {
  Object.keys(flairThumbs).forEach(function (scene) {
    window.TLCDFlair.paintThumb(flairThumbs[scene],
      {scene: scene, theme: pendingFlair.theme, motion: pendingFlair.motion,
       stars: pendingFlair.stars});
    flairThumbs[scene].classList.toggle("selected", pendingFlair.scene === scene);
  });
}

function refreshFlairUI(needsThumbs) {
  Object.keys(flairEls).forEach(function (k) {
    var el = flairEls[k];
    if (k === "glass") el.value = Math.round(pendingFlair.glass * 100);
    else if (el.type === "checkbox") el.checked = !!pendingFlair[k];
    else if (el.tagName === "SELECT" && k === "motion") {
      el.textContent = "";
      flairMotionOptions(pendingFlair.scene).forEach(function (pair) {
        var opt = document.createElement("option");
        opt.value = pair[0]; opt.textContent = pair[1];
        el.appendChild(opt);
      });
      el.value = pendingFlair.motion;
    } else if (el.type === "number") el.value = pendingFlair[k];
    else if (el.tagName === "SELECT") el.value = pendingFlair[k];
  });
  if (flairEls.speed) flairEls.speed.value = Math.round(pendingFlair.speed);
  // thumbnails are 8 full scene renders: only re-render them when something
  // that changes their pixels moved — the glass slider fires 'input'
  // continuously while dragging, and the thumbs are glass-independent.
  // Default true: initFlair's bare refreshFlairUI() must paint them too.
  if (needsThumbs !== false) refreshFlairThumbs();
}

function flairChanged(needsThumbs) {
  // thumbs default ON: scene/theme/stars change the canvas pixels. Controls
  // that cannot — the glass slider (fires 'input' continuously), spectrum
  // (paintThumb forces it off), scanlines (a DOM overlay, not canvas) —
  // pass false to skip re-rendering all 8 thumbnails.
  refreshFlairUI(needsThumbs !== false);
  pushPreview();
}

function initFlair(saved) {
  if (flairEls.scene) return;               // editor tab re-runs only on reload
  pendingFlair = Object.assign({}, window.TLCDFlair.DEFAULTS, saved || {});
  var aside = document.getElementById("palette");

  var h2 = document.createElement("h2");
  h2.textContent = "FLAIR";
  aside.appendChild(h2);

  Object.keys(window.TLCDFlair.SCENES).forEach(function (scene) {
    var c = document.createElement("canvas");
    c.className = "flair-thumb";
    c.width = 256; c.height = 62;           // panel aspect (1920x462 / 7.5)
    c.title = window.TLCDFlair.SCENES[scene].label;
    c.addEventListener("click", function () {
      if (pendingFlair.scene === scene) return;
      pendingFlair.scene = scene;
      // terrain scenes restrict motion; coerce and let the select rebuild
      var allowed = window.TLCDFlair.SCENES[scene].motions;
      if (allowed && allowed.indexOf(pendingFlair.motion) < 0)
        pendingFlair.motion = allowed[0];
      flairChanged();
    });
    aside.appendChild(c);
    flairThumbs[scene] = c;
  });

  function row(labelText, control) {
    var wrap = document.createElement("div");
    wrap.className = "flair-row";
    var label = document.createElement("label");
    label.textContent = labelText;
    wrap.appendChild(label);
    wrap.appendChild(control);
    aside.appendChild(wrap);
    return control;
  }
  function checkbox(labelText, key, needsThumbs) {
    var wrap = document.createElement("label");
    wrap.className = "flair-check";
    var input = document.createElement("input");
    input.type = "checkbox";
    input.addEventListener("change", function () {
      pendingFlair[key] = input.checked;
      flairChanged(needsThumbs);
    });
    wrap.appendChild(input);
    wrap.appendChild(document.createTextNode(labelText));
    aside.appendChild(wrap);
    return input;
  }

  var theme = document.createElement("select");
  Object.keys(window.TLCDFlair.THEMES).forEach(function (t) {
    var opt = document.createElement("option");
    opt.value = t; opt.textContent = window.TLCDFlair.THEMES[t].label;
    theme.appendChild(opt);
  });
  theme.addEventListener("change", function () {
    pendingFlair.theme = theme.value;
    flairChanged();
  });
  flairEls.theme = row("theme", theme);

  var motion = document.createElement("select");
  motion.addEventListener("change", function () {
    pendingFlair.motion = motion.value;
    flairChanged();
  });
  flairEls.motion = row("motion", motion);

  // T27 scene rotation: rides the flair config; the timer lives in the
  // panel's flair.js and never writes its pick back (saved scene stays
  // the user's default)
  var rotateMin = document.createElement("input");
  rotateMin.type = "number"; rotateMin.min = "0"; rotateMin.step = "1";
  rotateMin.addEventListener("change", function () {
    pendingFlair.rotate_min = Math.max(0, Number(rotateMin.value) || 0);
    flairChanged(false);
  });
  flairEls.rotate_min = row("rotate scene (min, 0 = off)", rotateMin);

  var rotateWhat = document.createElement("select");
  [["scene", "scene"], ["theme", "theme"], ["motion", "motion"],
   ["all", "scene + theme + motion"]].forEach(function (pair) {
    var opt = document.createElement("option");
    opt.value = pair[0]; opt.textContent = pair[1];
    rotateWhat.appendChild(opt);
  });
  rotateWhat.addEventListener("change", function () {
    pendingFlair.rotate_what = rotateWhat.value;
    flairChanged(false);
  });
  flairEls.rotate_what = row("what rotates", rotateWhat);

  flairEls.enabled = checkbox("background scene", "enabled", false);
  var speed = document.createElement("input");
  speed.type = "range"; speed.min = "0"; speed.max = "100";
  speed.addEventListener("input", function () {
    pendingFlair.speed = Number(speed.value);
    flairChanged(false);
  });
  flairEls.speed = row("scene speed", speed);

  flairEls.stars = checkbox("stars", "stars");
  flairEls.spectrum = checkbox("spectrum — the scene pulses with load", "spectrum", false);
  flairEls.scanlines = checkbox("CRT scanlines", "scanlines", false);

  var glass = document.createElement("input");
  glass.type = "range"; glass.min = "0"; glass.max = "100";
  glass.addEventListener("input", function () {
    pendingFlair.glass = glass.value / 100;
    flairChanged(false);
  });
  flairEls.glass = row("panel glass", glass);

  refreshFlairUI();
}

// -- T15 device selector: hidden with one panel (nothing changes), shown
// when more than one reports online; switching re-loads the editor scoped
// to the chosen panel. Offline panels stay listed but disabled.
(function () {
  var sel = document.getElementById("device-select");
  function refresh() {
    fetch("/api/devices")
      .then(function (r) { return r.json(); })
      .then(function (doc) {
        var devices = (doc && doc.devices) || [];
        if (devices.length < 2) { sel.hidden = true; return; }
        var keep = sel.value;
        sel.textContent = "";
        devices.forEach(function (d) {
          var opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = (d.online ? "" : "◯ ") + d.id +
                            "  " + d.w + "x" + d.h;
          opt.disabled = !d.online;
          if (d.id === (keep || DEVICE)) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.hidden = false;
      })
      .catch(function () {});
  }
  sel.addEventListener("change", function () {
    if (!sel.value || sel.value === DEVICE) return;
    var qs = new URLSearchParams(location.search);
    qs.set("device", sel.value);
    location.search = qs.toString();
  });
  refresh();
  setInterval(refresh, 5000);
})();

// -- D34 drawer toggle --
document.getElementById("palette-toggle").addEventListener("click", function () {
  document.getElementById("palette").classList.toggle("open");
});
</script>
