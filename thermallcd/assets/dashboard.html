<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>thermallcd</title>
<script>window.TLCD_TOKEN=__TOKEN__;</script>
<script>window.TLCD_FLAIR=__FLAIR__;</script>
<style>
  html, body { margin: 0; width: 1920px; height: 462px; overflow: hidden; }
  :root { --tlcd-glass: __GLASS__; }   /* widget glass, editor slider (flair) */
  body {
    /* boot fallback only — the flair canvas (z 1) paints the scene over it
       on its first platform tick; kept so a failed flair.js still shows a
       synthwave ground instead of a black panel */
    background:
      radial-gradient(120% 160% at 18% 110%, #2a0f3f 0%, rgba(42,15,63,0) 55%),
      linear-gradient(180deg, #07060d 0%, #0d0821 55%, #160b2e 78%, #1d0f38 100%);
    font-family: var(--tlcd-font-mono, monospace);
  }
  /* scene layer (z 1): the synth.html port (flair.js), stepped by the
     platform tick — see the script block (D37 motion budget) */
  #flair-scene {
    position: absolute; left: 0; top: 0; z-index: 1;
    width: 1920px; height: 462px;
  }
  /* scanline overlay (z 3): uncapped by decision D36, tuned by eye at the visual pass */
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  /* glass widget panels (z 2) — grid 12x3 (D33) */
  .grid {
    position: absolute; inset: 16px; z-index: 2;
    display: grid;
    /* minmax(0,1fr): plain 1fr floors a track at its items' min-content —
       an iframe contributes its intrinsic 150px height, which would grow
       every row past the 138px track (D33) */
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 8px;  /* D33 gutter */
  }
  .widget {
    /* iframes are replaced elements: grid stretch does not size them, so
       each one renders at its intrinsic 300x150 unless told to fill its
       area — width/height 100% makes the iframe content exactly the grid
       area (w*150 + (w-1)*8 by h*138 + (h-1)*8, D33) */
    width: 100%; height: 100%;
    border: 0;   /* the UA gives iframes a 2px inset border — it padded every
                    widget 4px past its slot and floored rows at intrinsic
                    150px; the old author border masked it */
    box-shadow: 0 0 0 1px rgba(40, 32, 67, .9);  /* hairline (D18 layer 2);
                                                    outside the box so the
                                                    content keeps full size */
    border-radius: 6px;                       /* D33 radius */
    background: rgba(15, 11, 29, var(--tlcd-glass, .82));  /* glass, editor slider */
    backdrop-filter: blur(2px);
    overflow: hidden;
    opacity: 0;                               /* D22: fade in on first render */
    animation: fadein .6s ease-out .1s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  /* URL watermark (z 4): scrim + minimum contrast (D20) */
  .watermark {
    position: absolute; right: 10px; bottom: 6px; z-index: 4;
    font-family: monospace; font-size: 16px; color: #b9b2cc;
    background: rgba(7, 6, 13, .55);          /* the scrim */
    padding: 3px 10px; border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="flair-scene" width="1920" height="462"></canvas>
  <div class="grid">
    /*__FRAMES__*/
  </div>
  <div class="scanlines"></div>
  <div class="watermark">/*__WATERMARK__*/</div>
<script src="/assets/flair.js"></script>
<script>
  // boot: honor saved-flair toggles before first paint — scanlines off
  // hides the overlay; the scene disabled leaves #flair-scene unmounted
  // (flair.js checks enabled) and hidden (the editor path flips this live
  // through renderPreview instead)
  if (window.TLCD_FLAIR && window.TLCD_FLAIR.scanlines === false) {
    document.querySelector(".scanlines").style.display = "none";
  }
  if (window.TLCD_FLAIR && window.TLCD_FLAIR.enabled === false) {
    document.getElementById("flair-scene").style.display = "none";
  }

  // D37 motion budget: the platform tick. --tlcd-tick steps at ~15 Hz,
  // matching the capture's 15 FPS frame clock so every panel frame carries
  // fresh pixels, and flair steps one repaint per tick, advancing
  // continuously at the deck's cruise speed (flair.js CAM_SPEED). The 0.5 Hz
  // first cut crawled; 4-7 Hz steps still read as skipping. Widgets that
  // later want in on the budget read --tlcd-tick.
  var tlcdTick = 0;
  setInterval(function () {
    tlcdTick++;
    document.documentElement.style.setProperty("--tlcd-tick", tlcdTick);
    if (window.TLCDFlair) window.TLCDFlair.step();
  }, 64);

  // D27: a saved layout change is visible on the panel within one second
  (function pollLayout() {
    var etag = "";
    setInterval(function () {
      fetch("/api/layout?device=default&token=" + encodeURIComponent(window.TLCD_TOKEN))
        .then(function (r) { return r.json(); })
        .then(function (doc) {
          var stamp = JSON.stringify(doc);
          if (etag && stamp !== etag) location.reload();
          etag = stamp;
        })
        .catch(function () {});
    }, 1000);
  })();

  // Live editor preview: the editor postMessages its unsaved layout on
  // every change. Same-id widgets reposition in place — content never
  // reloads, so widgets visibly glide while you drag. New ids fetch their
  // frame from /api/frame; ids gone from the layout leave. After a
  // post-save reload (the poll above) the server markup is already
  // current, so the editor's re-push is a no-op reposition.
  var lastFlairJson = "";
  function renderPreview(widgets, flair) {
    // flair rides the same push: the editor's picker hot-swaps the scene and
    // the glass without a reload, mirroring how widget frames glide. The
    // editor re-pushes every 2 s, so skip unchanged configs — an apply()
    // forces a full scene render, and it must not double with the tick.
    if (flair) {
      var j = JSON.stringify(flair);
      if (j !== lastFlairJson) {
        lastFlairJson = j;
        if (window.TLCDFlair) window.TLCDFlair.apply(flair);
        document.documentElement.style.setProperty("--tlcd-glass",
          Math.max(0, Math.min(1, Number(flair.glass) || 0.82)));
        // CRT scanline overlay (D36): a DOM layer above the scene, so the
        // toggle is a display flip here, not a scene re-render
        var sl = document.querySelector(".scanlines");
        if (sl) sl.style.display = flair.scanlines === false ? "none" : "";
        // the scene itself: enabled:false hides the canvas (flair.js apply()
        // mounts on demand when a later push re-enables)
        var fs = document.getElementById("flair-scene");
        if (fs) fs.style.display = flair.enabled === false ? "none" : "";
      }
    }
    var grid = document.querySelector(".grid");
    var keep = {};
    var latest = {};
    // self-heal: drop duplicate same-wid frames (a page that lived through
    // the pre-guard duplicate race cleans itself on the next push; keep the
    // first — it is the one later pushes have been repositioning)
    var seenWid = {};
    grid.querySelectorAll("iframe.widget").forEach(function (f) {
      var id = f.getAttribute("data-wid");
      if (seenWid[id]) { f.remove(); return; }
      seenWid[id] = true;
    });
    widgets.forEach(function (w) { latest[w.id] = w; });
    widgets.forEach(function (w) {
      keep[w.id] = true;
      var col = (w.x + 1) + " / span " + w.w;
      var row = (w.y + 1) + " / span " + w.h;
      var f = grid.querySelector('iframe[data-wid="' + w.id + '"]');
      if (f) {
        f.style.gridColumn = col;
        f.style.gridRow = row;
        return;
      }
      fetch("/api/frame?id=" + encodeURIComponent(w.id) +
            "&token=" + encodeURIComponent(window.TLCD_TOKEN))
        .then(function (r) { return r.json(); })
        .then(function (doc) {
          // rapid pushes (drags fire change continuously) must not stack
          // duplicate frames while an earlier response is in flight: only
          // the newest push may add, and only if no frame exists yet — a
          // leftover duplicate would freeze at its old slot and look like
          // the widgets swapped places
          if (!doc.srcdoc || latest[w.id] !== w) return;
          if (grid.querySelector('iframe[data-wid="' + w.id + '"]')) return;
          var nf = document.createElement("iframe");
          nf.className = "widget";
          nf.setAttribute("data-wid", w.id);
          nf.style.gridColumn = col;
          nf.style.gridRow = row;
          nf.title = doc.title || w.id;
          nf.srcdoc = doc.srcdoc;
          grid.appendChild(nf);
        })
        .catch(function () {});
    });
    grid.querySelectorAll("iframe.widget").forEach(function (f) {
      if (!keep[f.getAttribute("data-wid")]) f.remove();
    });
  }
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.tlcdPreview) return;
    renderPreview(e.data.tlcdPreview.widgets, e.data.tlcdPreview.flair);
  });
</script>
</body>
</html>
